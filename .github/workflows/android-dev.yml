name: Android CI - Development

on:
  push:
    branches:
      - dev
      - feature/*
  pull_request:
    branches:
      - dev

jobs:
  primary-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check Gradle Wrapper
      uses: gradle/wrapper-validation-action@v1

    - name: Generate Lint Baseline
      run: ./gradlew updateLintBaseline

    - name: Check Android Lint
      continue-on-error: true  # Temporarily allow continuing even if lint fails
      run: ./gradlew lint

    - name: Upload Lint Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-results
        path: app/build/reports/lint-results-debug.html

    - name: Check Code Style
      continue-on-error: true  # Temporarily allow continuing even if ktlint fails
      run: |
        ./gradlew ktlintCheck || true
        ./gradlew ktlintFormat

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Check Dependency Updates
      continue-on-error: true  # Allow the build to continue even if updates are available
      run: |
        ./gradlew dependencyUpdates || true
        if [ -f "build/dependencyUpdates/report.txt" ]; then
          echo "::group::Dependency Updates Available"
          cat build/dependencyUpdates/report.txt
          echo "::endgroup::"
        fi

  build:
    needs: primary-checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v2
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Build Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-reports
        path: app/build/reports/

    - name: Create Pre-release
      if: github.ref == 'refs/heads/dev'
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ env.NEW_VERSION }}-beta
        name: "Beta v${{ env.NEW_VERSION }}"
        body: |
          🚧 Beta Release v${{ env.NEW_VERSION }}
          
          This is a pre-release build from the development branch.
          ⚠️ This version may contain bugs and is not intended for production use.
          
          Changes in this version:
          ${{ github.event.head_commit.message }}
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}