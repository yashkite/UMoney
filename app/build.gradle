plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "com.elececo.umoney"
        minSdk 23
        targetSdk 33
        
        // Version format: major.minor.patch
        def versionMajor = 0
        def versionMinor = 1
        def versionPatch = project.hasProperty('versionPatch') ? project.property('versionPatch') : 0
        
        versionCode = (versionMajor * 10000) + (versionMinor * 100) + versionPatch
        versionName = "${versionMajor}.${versionMinor}.${versionPatch}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.elececo.umoney'

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    lintOptions {
        abortOnError true
        warningsAsErrors true
        checkAllWarnings true
        htmlReport true
        htmlOutput file("${project.buildDir}/reports/lint/lint-results.html")
    }
}

dependencies {
    // FirebaseUI
    implementation 'com.firebaseui:firebase-ui-database:7.2.0'
    implementation 'com.firebaseui:firebase-ui-firestore:8.0.2'
    implementation 'com.firebaseui:firebase-ui-auth:8.0.0'
    implementation 'com.firebaseui:firebase-ui-storage:7.2.0'

    // Firebase (versions managed by BOM)
    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Firebase Tasks
    implementation 'com.google.android.gms:play-services-tasks:18.2.0'

    // Other dependencies
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.orhanobut:dialogplus:1.11@aar'

    // Fragments
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-android:2.8.7'

    // Testing
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    // Google Drive
    implementation 'com.google.android.gms:play-services-drive:17.0.0'
    implementation 'com.google.api-client:google-api-client-android:2.2.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20230822-2.0.0'

    // Development dependencies
    implementation 'com.jakewharton.timber:timber:5.0.1'
    
    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'

    // Preference
    implementation 'androidx.preference:preference:1.2.1'
}
